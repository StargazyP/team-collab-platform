server {
    listen 443 ssl;
    server_name jangdonggun.duckdns.org jangdonggun.iptime.org localhost;

    # Docker DNS를 통해 upstream 컨테이너 IP 변경(재시작/재생성)을 주기적으로 재해석
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nextjs_upstream nextjs-front:3008;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://$nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTPS(443)에서 들어온 WebSocket을 내부 ws 서버(8081)로 프록시
    location /ws {
        proxy_pass http://workspace-ws:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

